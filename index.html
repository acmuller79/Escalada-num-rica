<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escalada Numérica</title>
    <link rel="manifest" href="/manifest.json" />
    <!-- Open Graph / Meta tags para compartilhamento (WhatsApp, Facebook, etc) -->
    <meta property="og:title" content="Escalada Numérica" />
    <meta property="og:description" content="Encare o jogo da Escalada Numérica de 1 a 100!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://escaladanumericaacm.netlify.app/" />
    <!-- A imagem que vai aparecer ao compartilhar -->
    <meta property="og:image" content="https://escaladanumericaacm.netlify.app/share-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
